<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exposiciones | linaum</title>

<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

@font-face {
    font-family: "Sineas";
    src: url("Sineas.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:white;
font-family:'Manrope',sans-serif;
color:#202020;

}

/*=========================
MENÚ
=========================*/

header{

padding:40px 0 30px;

display:flex;

justify-content:center;

}

.nav{

display:flex;

gap:55px;

}

.nav a,
.nav span{

position:relative;

text-decoration:none;

color:#202020;

font-size:.9rem;

letter-spacing:.08em;

transition:.3s;

}

.nav a::after,
.nav span::after{

content:"";

position:absolute;

left:0;

bottom:-7px;

width:0;

height:2px;

background:#B95D3F;

transition:.35s;

}

.nav a:hover{

color:#B95D3F;

}

.nav a:hover::after{

width:100%;

}

.nav .active{

color:#B95D3F;

font-weight:800;

cursor:default;

}

.nav .active::after{

width:100%;

}

/*=========================
AFICHES (3, centrados)
=========================*/

.afiches{

    width:min(1100px,92%);
    margin:60px auto 0;
    padding-bottom:80px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:50px;

}

.afiche{

    display:block;
    border:none;
    background:none;
    padding:0;
    cursor:pointer;
    width:calc((100% - 100px)/3);

    /* animación de aparición */
    opacity:0;
    transform:translateY(36px);
    transition:opacity 1.3s ease, transform 1.3s ease;

}

.afiche.visible{

    opacity:1;
    transform:translateY(0);

}

.afiche img{

    width:100%;
    height:auto;
    aspect-ratio:var(--proporcion, auto);  /* todos toman la proporción del primer afiche (ver script) */
    object-fit:cover;                      /* si prefieres que no se recorte nada: contain */
    display:block;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    transition:.35s ease;

}

.afiche:hover img{

    transform:scale(1.03);
    box-shadow:0 14px 34px rgba(0,0,0,.2);

}

/*=========================
AFICHE AMPLIADO (una sola imagen, sin carrusel)
=========================*/

.lightbox{

    position:fixed;
    inset:0;
    background:rgba(20,20,20,.94);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:100;

}

.lightbox.abierto{

    opacity:1;
    pointer-events:auto;

}

.lightbox img{

    max-width:90vw;
    max-height:90vh;
    object-fit:contain;
    display:block;

}

.lb-cerrar{

    position:absolute;
    top:28px;
    right:36px;
    background:none;
    border:none;
    color:white;
    font-size:1.6rem;
    font-weight:300;
    cursor:pointer;
    opacity:.75;
    transition:.25s;
    line-height:1;

}

.lb-cerrar:hover{ opacity:1; }

/*=========================
FOOTER
=========================*/

footer{

    width:100%;
    text-align:center;
    padding:70px 20px 35px;
    font-size:.75rem;
    font-weight:300;
    letter-spacing:.12em;
    color:#B8B8B8;

}

/*=========================
RESPONSIVE
=========================*/

@media(max-width:900px){

.afiche{
    width:calc((100% - 50px)/2);
}

}

@media(max-width:650px){

.nav{
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    padding:0 20px;
}

.afiches{
    gap:36px;
}

.afiche{
    width:min(420px,100%);
}

}

</style>

</head>

<body>

<header>

<nav class="nav">

<a href="index.html">Inicio</a>

<a href="obras.html">Obras</a>

<span class="active">Exposiciones</span>

<a href="estudios.html">Estudios</a>

<a href="artista.html">Artista</a>

</nav>

</header>

<!-- ============================================================
     AFICHES DE LAS EXPOSICIONES
     Para cambiar un afiche, edita el nombre del archivo (src) y el alt.
     Para agregar otra exposición, copia un bloque <button class="afiche"> completo.
============================================================ -->
<section class="afiches" id="afiches">

    <button type="button" class="afiche">
        <img src="invitacion_susurro.png" alt="Afiche exposición 1">
    </button>

    <button type="button" class="afiche">
        <img src="invitaccion_fraccion" alt="Afiche exposición 2">
    </button>

    <button type="button" class="afiche">
        <img src="afiche3.jpg" alt="Afiche exposición 3">
    </button>

</section>

<!-- AFICHE AMPLIADO -->
<div class="lightbox" id="lightbox">
    <button class="lb-cerrar" id="lbCerrar" aria-label="Cerrar">✕</button>
    <img id="lbImagen" src="" alt="">
</div>

<footer>

    Catalina Ulloa Mujica · Artista Visual

</footer>

<script>
/* ============================================================
   ANIMACIÓN DE APARICIÓN AL HACER SCROLL
============================================================ */
const afiches = Array.from(document.querySelectorAll('#afiches .afiche'));

afiches.forEach((afiche, i) => {
    afiche.style.transitionDelay = (i % 3) * 0.15 + "s";
});

const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(entrada => {
        if(entrada.isIntersecting){
            entrada.target.classList.add('visible');
            observador.unobserve(entrada.target);
        }
    });
}, { threshold: 0.1 });

afiches.forEach(afiche => observador.observe(afiche));

/* ============================================================
   MISMO TAMAÑO: todos los afiches toman la proporción del primero
============================================================ */
const contenedorAfiches = document.getElementById('afiches');
const primerAfiche = afiches[0].querySelector('img');

function igualarTamano(){
    if(primerAfiche.naturalWidth){
        contenedorAfiches.style.setProperty('--proporcion', primerAfiche.naturalWidth + ' / ' + primerAfiche.naturalHeight);
    }
}

if(primerAfiche.complete){
    igualarTamano();
}else{
    primerAfiche.addEventListener('load', igualarTamano);
}

/* ============================================================
   AFICHE AMPLIADO: se abre al apretar; se cierra con la X,
   haciendo click fuera de la imagen o con la tecla Esc
============================================================ */
const lightbox = document.getElementById('lightbox');
const lbImagen = document.getElementById('lbImagen');

afiches.forEach(afiche => {
    afiche.addEventListener('click', () => {
        const img = afiche.querySelector('img');
        lbImagen.src = img.src;
        lbImagen.alt = img.alt;
        lightbox.classList.add('abierto');
    });
});

function cerrarLightbox(){
    lightbox.classList.remove('abierto');
}

document.getElementById('lbCerrar').addEventListener('click', cerrarLightbox);

lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) cerrarLightbox();
});

document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') cerrarLightbox();
});
</script>

</body>

</html>
